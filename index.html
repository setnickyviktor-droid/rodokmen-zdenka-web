<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rodinný rodokmeň</title>
<style>
:root {
  --bg: #f5f3ee; --surface: #ffffff; --text: #1e1c19; --muted: #6a655c; --border: #dcd6ca;
  --accent: #7a4a26; --accent-text: #ffffff; --err: #a3352b;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --surface: #201f1c; --text: #ece8e0; --muted: #a39d92; --border: #3a3732;
    --accent: #d9a273; --accent-text: #1e1c19; --err: #e8786b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --surface: #201f1c; --text: #ece8e0; --muted: #a39d92; --border: #3a3732;
  --accent: #d9a273; --accent-text: #1e1c19; --err: #e8786b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); display: grid; place-items: center;
       padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 26px 24px;
        box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.07); }
.card svg { width: 44px; height: 44px; color: var(--accent); display: block; margin-bottom: 6px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--muted); font-size: 14.5px; }
label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); }
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chk { display: flex; gap: 8px; align-items: center; font-weight: normal; color: var(--muted); margin: 12px 0 16px; }
button { width: 100%; font: inherit; font-weight: 600; padding: 11px; border: none; border-radius: 9px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
button[disabled] { opacity: .65; cursor: progress; }
#err { color: var(--err); margin: 12px 0 0; font-size: 14px; }
</style>
</head>
<body>
<main class="card">
  <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="18" y="4" width="12" height="9" rx="2"/><rect x="4" y="35" width="12" height="9" rx="2"/><rect x="32" y="35" width="12" height="9" rx="2"/>
    <rect x="18" y="20" width="12" height="9" rx="2"/><path d="M24 13v7M24 29v3H10v3M24 32h14v3"/>
  </svg>
  <h1>Rodokmeň</h1>
  <p>Súkromný rodinný rodokmeň. Na otvorenie zadaj heslo, ktoré si dostal(a) od Viktora.</p>
  <form id="f" autocomplete="on">
    <label for="heslo">Heslo</label>
    <input id="heslo" name="heslo" type="password" autocomplete="current-password" required autofocus>
    <label class="chk"><input type="checkbox" id="pamataj"> Zapamätať heslo v tomto prehliadači</label>
    <button type="submit" id="btn">Otvoriť rodokmeň</button>
    <p id="err" role="alert" hidden></p>
  </form>
</main>

const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function odomkni(heslo) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(heslo), "PBKDF2", false, ["deriveKey"]);
  const kluc = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bin(SOL), iterations: ITER, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const text = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bin(IV) }, kluc, bin(DATA));
  return new TextDecoder().decode(text);
}
function zobraz(html) { document.open(); document.write(html); document.close(); }
const err = document.getElementById("err"), btn = document.getElementById("btn");
function chyba(t) { err.textContent = t; err.hidden = false; btn.disabled = false; btn.textContent = "Otvoriť rodokmeň"; }
async function skus(heslo, ulozit) {
  if (!window.crypto || !crypto.subtle) { chyba("Tento prehliadač nevie stránku odomknúť. Otvor ju v aktuálnom Chrome, Edge, Firefoxe alebo Safari."); return false; }
  btn.disabled = true; btn.textContent = "Odomykám…"; err.hidden = true;
  try {
    const html = await odomkni(heslo);
    if (ulozit) { try { localStorage.setItem("rodokmen-zdenka-heslo", heslo); } catch (_) {} }
    zobraz(html);
    return true;
  } catch (_) {
    chyba("Nesprávne heslo. Skús to znova.");
    return false;
  }
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  skus(document.getElementById("heslo").value, document.getElementById("pamataj").checked);
});
(async () => {
  let ulozene = null;
  try { ulozene = localStorage.getItem("rodokmen-zdenka-heslo"); } catch (_) {}
  if (ulozene && !(await skus(ulozene, false))) { try { localStorage.removeItem("rodokmen-zdenka-heslo"); } catch (_) {} err.hidden = true; }
})();
